[versions]
# Vendored assets (not a Maven dep — consumed by the `downloadPdfJs` Gradle task).
# Held at 4.10.x: the 5.x and 6.x lines adopt Uint8Array.toHex/toBase64 and
# Map.prototype.getOrInsertComputed, which the bundled JCEF (Chromium 137) does not
# ship — the preview fails with "toHex is not a function". Bumping this pin REQUIRES
# re-running `./gradlew downloadPdfJs` to materialise the assets, and only once the
# JetBrains Runtime ships Chromium >= 140.
pdfjs = "4.10.38"
# libraries
junit4 = "4.13.2"
mockwebserver = "5.4.0"
opentest4j = "1.3.0"
mockitoKotlin = "6.3.0"

# plugins
changelog = "2.5.0"
intelliJPlatform = "2.18.1"
kotlin = "2.4.10"
kover = "0.9.9"
qodana = "2026.2.0"

[libraries]
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "mockwebserver" }
opentest4j = { group = "org.opentest4j", name = "opentest4j", version.ref = "opentest4j" }
mockitoKotlin = { group = "org.mockito.kotlin", name = "mockito-kotlin", version.ref = "mockitoKotlin"}

[plugins]
changelog = { id = "org.jetbrains.changelog", version.ref = "changelog" }
intelliJPlatform = { id = "org.jetbrains.intellij.platform", version.ref = "intelliJPlatform" }
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
qodana = { id = "org.jetbrains.qodana", version.ref = "qodana" }
