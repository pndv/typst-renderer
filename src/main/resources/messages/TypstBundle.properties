# --- Action menu entries ---
action.Typst.Compile.text=Compile Typst File
action.Typst.Compile.description=Compile the current Typst file to PDF
action.Typst.PinMainFile.text=Pin as Typst Main File
action.Typst.PinMainFile.description=Pin this file as the compilation entry so cross-file references resolve when editing chapter files
action.Typst.UnpinMainFile.text=Unpin Typst Main File
action.Typst.UnpinMainFile.description=Clear the pinned compile entry and revert to compiling the focused file

# Toolbar actions on the Typst Output tool window title bar
action.Typst.RecompileFromOutput.text=Recompile
action.Typst.RecompileFromOutput.description=Recompile the last Typst file
action.Typst.ClearOutputConsole.text=Clear Console
action.Typst.ClearOutputConsole.description=Clear the Typst output console
action.Typst.ScrollOutputToEnd.text=Scroll to End
action.Typst.ScrollOutputToEnd.description=Scroll the Typst output console to the latest line

# --- Settings page (Settings > Tools > Typst) ---
settings.displayName=Typst Renderer

settings.lsp.group.label=Language Server (Tinymist)
settings.lsp.status.text=Status:
settings.lsp.path.label=Tinymist path
settings.lsp.path.text=Select Tinymist Binary
settings.lsp.path.comment=Path to the tinymist binary. Leave empty for auto-detection.
settings.lsp.binary.found.text=✓ Found: {0}
settings.lsp.binary.notFound.text=✗ Not found (will auto-download when a .typ file is opened)

settings.lsp.download.label=Download Tinymist
settings.lsp.download.text=Downloading…
settings.lsp.download.failed.text=Download failed
settings.lsp.download.comment=Downloads the latest tinymist binary from GitHub for this platform.

settings.preview.group.label=Preview
settings.preview.checkbox.label=Remember the PDF preview scroll position across the IDE restarts
settings.preview.checkbox.comment=When enabled, reopening a .typ file restores the preview to the page and scroll offset you were viewing. Scroll position is always preserved across recompilation within a session regardless of this setting.

# --- Project-scoped settings page (Settings > Tools > Typst > Project Overrides) ---
settings.project.displayName=Project Overrides
settings.project.overrides.group.label=Per-Project Overrides
settings.project.root.label=Typst project root
settings.project.root.select.text=Select Typst Project Root Directory
settings.project.root.comment=Directory passed as --root to the Typst CLI and as the working directory to tinymist. Leave blank to use the project base path.
settings.project.fontPath.label=Font path
settings.project.fontPath.select.text=Select Font Directory
settings.project.fontPath.comment=Directory containing extra fonts to make available to the Typst compiler and LSP. Leave blank to use system fonts only.
settings.project.exportPath.label=Export directory
settings.project.exportPath.comment=Directory, relative to the project root, where compiled PDFs are written; the source folder structure is mirrored beneath it. Leave blank to use the default (target).
settings.project.mainFile.label=Main entry file
settings.project.mainFile.select.text=Select Typst Main Entry File
settings.project.mainFile.comment=The .typ file (usually main.typ) pinned as the compile entry for this multi-file project, so cross-file references resolve when editing an included chapter file. Leave blank to compile the focused file.


