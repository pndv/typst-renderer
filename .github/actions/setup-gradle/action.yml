name: Setup Gradle
description: Sets up Gradle with standard project settings (centralises versioning)

inputs:
  cache-read-only:
    description: Whether Gradle cache should be read-only
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: ${{ inputs.cache-read-only }}
